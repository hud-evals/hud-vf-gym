###########################################
# PRIME-RL RL trainer config for HUD 2048 #
###########################################

output_dir = "/workspace/checkpoints/trainer"
max_steps = 200
async_level = 1

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
trust_remote_code = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.experimental.lora]
rank = 16
alpha = 32.0
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[optim]
type = "adamw"
lr = 1.0e-5
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weights]
interval = 200
save_format = "safetensors"
save_async = true

[log]
level = "info"
vf_level = "warn"
file = true
log_data = false

[wandb]
project = "hud-prime-rl"
offline = false

