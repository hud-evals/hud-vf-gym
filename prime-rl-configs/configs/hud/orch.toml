############################################
# PRIME-RL orchestrator config for HUD 2048 #
############################################

output_dir = "__REMOTE_BASE__/checkpoints/prime-rl"
batch_size = 4
rollouts_per_example = 4
max_concurrent = 4
seq_len = 8192
async_level = 1

[client]
base_url = ["http://127.0.0.1:8000/v1"]
api_key_var = "OPENAI_API_KEY"
timeout = 1200

[model]
name = "openai/gpt-oss-20b"
trust_remote_code = true

[sampling]
max_tokens = 512
temperature = 1.0

[[env]]
id = "hud-vf-gym"
name = "hud-2048"

[env.args]
taskset = "hud-evals/2048-taskset"
config_path = "__REMOTE_BASE__/configs/2048.yaml"
task_index = 0
replicate_to = 128

[log]
level = "info"
vf_level = "warn"
file = true
log_data = false

