############################################
# PRIME-RL orchestrator config for HUD 2048 #
############################################

output_dir = "/workspace/checkpoints/orchestrator"
batch_size = 4
rollouts_per_example = 4
max_concurrent = 8
seq_len = 2048
async_level = 1

[client]
base_url = ["http://127.0.0.1:8000/v1"]
api_key_var = "OPENAI_API_KEY"
timeout = 1200

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
trust_remote_code = true

[sampling]
max_tokens = 256
temperature = 1.0

[[env]]
id = "hud-vf-gym"
name = "hud-2048"

[env.args]
taskset = "hud-evals/2048-taskset"
config_path = "/workspace/configs/2048.yaml"
num_tasks = 6
replicate_to = 256

[log]
level = "info"
vf_level = "warn"
file = true
log_data = false

