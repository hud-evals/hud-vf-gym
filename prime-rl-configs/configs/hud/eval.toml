#########################################
# PRIME-RL offline eval config for HUD #
#########################################

output_dir = "/workspace/checkpoints/eval"
weights_dir = "/workspace/checkpoints/trainer"
use_tqdm = true
max_concurrent = 16
num_examples = 64
rollouts_per_example = 1

[client]
base_url = ["http://127.0.0.1:8000/v1"]
api_key_var = "OPENAI_API_KEY"
timeout = 36000

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
trust_remote_code = true

[sampling]
max_tokens = 256
temperature = 1.0

[[env]]
id = "hud-vf-gym"
name = "hud-2048"

[env.args]
taskset = "hud-evals/2048-taskset"
config_path = "/workspace/configs/2048.yaml"
num_tasks = 1

[log]
level = "info"
vf_level = "warn"
file = true
log_data = false

